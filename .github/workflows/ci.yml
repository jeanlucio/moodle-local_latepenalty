name: Moodle Plugin CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGES.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGES.md'

permissions:
  contents: read

jobs:
  test:
    # ubuntu-22.04 began deprecation 17/09/2026 (brownouts from now, unsupported
    # 17/04/2027) — https://github.com/actions/runner-images/issues/14254.
    runs-on: ubuntu-24.04

    services:
      # Only the database a given leg actually tests is started for it (matrix.database
      # gates each image), matching moodlehq/moodle-plugin-ci's own gha.dist.yml template —
      # a broken image for one engine no longer takes down legs that never touch it.
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      # Floating on the 11.x major, not pinned — this plugin gets periodic maintenance, so
      # an incompatible point release surfaces at the next visit rather than needing its own
      # bump commit. A major only moves forward within itself, so this never resolves below
      # 5.3's own 11.4.0 floor.
      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: 'utf8mb4'
          MYSQL_COLLATION_SERVER: 'utf8mb4_unicode_ci'
        ports:
          - 3306:3306
        # mariadb:11.4+ dropped the mysql*-prefixed client binaries entirely — a raw client
        # ping is also the wrong tool regardless, since it doesn't know InnoDB is actually
        # ready. healthcheck.sh is the image's own bundled script for exactly this, and
        # matches the official template.
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          # Moodle 5.3 is still beta with no MOODLE_503_STABLE branch yet — main is the
          # only way to test against it before that branch is cut, a moving target
          # moodle-plugin-ci itself supports for exactly this. PHP 8.3 is main's own declared
          # minimum (public/admin/environment.xml).
          - {moodle-branch: 'main', php: '8.3', database: 'pgsql'}
          - {moodle-branch: 'main', php: '8.4', database: 'mariadb'}
          # runchecks: 'all' (the full lint suite) only needs one leg total — phpcs/phpdoc
          # come from moodle-plugin-ci's own toolchain, fixed regardless of MOODLE_BRANCH.
          # grunt is the one exception (ESLint/stylelint configs live in the checked-out
          # core), so this leg is kept on the newest true stable, not on main.
          - {moodle-branch: 'MOODLE_502_STABLE', php: '8.3', database: 'pgsql', runchecks: 'all'}
          - {moodle-branch: 'MOODLE_502_STABLE', php: '8.4', database: 'mariadb'}
          - {moodle-branch: 'MOODLE_501_STABLE', php: '8.3', database: 'pgsql'}
          - {moodle-branch: 'MOODLE_501_STABLE', php: '8.2', database: 'mariadb'}
          - {moodle-branch: 'MOODLE_500_STABLE', php: '8.2', database: 'pgsql'}
          - {moodle-branch: 'MOODLE_500_STABLE', php: '8.2', database: 'mariadb'}
          # 4.5 supports PHP 8.1-8.3 (docs.moodle.org/502/en/PHP); spread across its two
          # legs like 5.1's own 8.3/8.2 split, instead of adding a third.
          - {moodle-branch: 'MOODLE_405_STABLE', php: '8.1', database: 'pgsql'}
          - {moodle-branch: 'MOODLE_405_STABLE', php: '8.2', database: 'mariadb'}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, mysqli, gd, xml, dom, json, zip, bcmath, intl, soap, sodium
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() && matrix.runchecks == 'all' }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() && matrix.runchecks == 'all' }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() && matrix.runchecks == 'all' }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() && matrix.runchecks == 'all' }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() && matrix.runchecks == 'all' }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() && matrix.runchecks == 'all' }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() && matrix.runchecks == 'all' }}
        run: moodle-plugin-ci mustache

      - name: Grunt tasks
        if: ${{ !cancelled() && matrix.runchecks == 'all' }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat tests
        id: behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome --scss-deprecations

      - name: Upload Behat Faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: Behat Faildump (${{ join(matrix.*, ', ') }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark cancelled jobs as failed
        if: ${{ cancelled() }}
        run: exit 1
