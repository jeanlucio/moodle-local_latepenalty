# Submits a tagged release to the Moodle Marketplace API
# (https://marketplace.moodle.com/api/plugins/{component}/versions).
#
# Required secret: MOODLE_MARKETPLACE_TOKEN
# (generate at https://marketplace.moodle.com/account/security)
#
# The previous version of this file targeted the legacy Plugins directory endpoint
# (local_plugins_add_version at moodle.org), retired when the Plugins directory went
# read-only on 2026-07-14 in favour of the Marketplace. This replaces it with the
# current Marketplace API.
#
# Previously delegated the whole submission to the moodlehq/moodle-plugin-release
# reusable workflow (see https://github.com/moodlehq/moodle-plugin-release). Vendored
# inline instead of two problems found on the v1.1.1 release of this plugin
# (2026-09-07), neither fixable from a caller workflow alone:
#
# 1. That reusable workflow's "Extract Release Notes" step reads the GitHub Release
#    body via `gh release view`, but its trigger (push: tags) fired in parallel with
#    github-release.yml on the same tag push — a race that could submit to the
#    Marketplace before the GitHub Release existed, landing with empty release notes.
#    Fixed by triggering this workflow on the completion of "Create GitHub Release"
#    instead (see the `on: workflow_run` block below), which this file's own trigger
#    can control regardless of what the reusable workflow does internally.
# 2. Per the API docs (https://moodledev.io/general/community/plugincontribution/
#    moodlemarketplaceapi), `vcsRepositoryUrl` and `vcsBranch` are per-submission
#    fields — there is no endpoint to edit them on an already-submitted version, only
#    to set them at submission time. The reusable workflow's curl call never sends
#    them, and its `workflow_call` interface only accepts a `tag` input, so a caller
#    workflow has no way to supply them through that interface. Submitting the
#    request directly here lets this repository's URL and branch be included on
#    every release, not just fixed once by hand in the Marketplace UI.
#
name: Releasing in Moodle Marketplace

on:
  workflow_run:
    workflows:
      - Create GitHub Release
    types:
      - completed

  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to be released (e.g. v1.4.0)'
        required: true
        type: string

jobs:
  release-to-marketplace:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    env:
      BASE_URL: 'https://marketplace.moodle.com/api'
      TOKEN: ${{ secrets.MOODLE_MARKETPLACE_TOKEN }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Resolve tag name
        id: resolve-tag
        run: |
          TAGNAME="${{ inputs.tag || github.event.workflow_run.head_branch }}"

          if [[ -z "${TAGNAME}" ]]; then
            echo "::error::No tag name resolved!"
            exit 1
          fi

          echo "tag=${TAGNAME}" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve-tag.outputs.tag }}

      - name: Build zip package
        id: package
        run: |
          COMPONENT=$(php -r '$c = file_get_contents("version.php"); preg_match("/component\s*=\s*[\x27\"]([a-z0-9_]+)[\x27\"]/", $c, $m); echo $m[1] ?? "";')

          if [[ -z "$COMPONENT" ]]; then
            echo "::error::Could not read \$plugin->component from version.php"
            exit 1
          fi

          DIRNAME="${COMPONENT#*_}"
          ZIP_FILE="${DIRNAME}.zip"

          git archive --format=zip --prefix="${DIRNAME}/" -o "$ZIP_FILE" HEAD

          echo "component=${COMPONENT}" >> "$GITHUB_OUTPUT"
          echo "zip_file=${ZIP_FILE}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        id: release_notes
        env:
          TAGNAME: ${{ steps.resolve-tag.outputs.tag }}
        run: |
          NOTES=$(gh release view "$TAGNAME" --repo "${{ github.repository }}" --json body -q '.body' 2>/dev/null || true)

          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Submit version to Marketplace API
        env:
          TAGNAME: ${{ steps.resolve-tag.outputs.tag }}
          COMPONENT: ${{ steps.package.outputs.component }}
          ZIP_FILE: ${{ steps.package.outputs.zip_file }}
          NOTES: ${{ steps.release_notes.outputs.notes }}
          REPO_URL: ${{ github.event.repository.html_url || format('https://github.com/{0}', github.repository) }}
          REPO_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          ENDPOINT="${BASE_URL}/plugins/${COMPONENT}/versions"

          echo "Submitting $ZIP_FILE for component $COMPONENT to $ENDPOINT..."

          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -F "file=@${ZIP_FILE}" \
            -F "releaseNotes=${NOTES}" \
            -F "vcsRepositoryUrl=${REPO_URL}" \
            -F "vcsBranch=${REPO_BRANCH}" \
            -F "vcsTag=${TAGNAME}" \
            "${ENDPOINT}")

          echo "Response HTTP Status: ${HTTP_STATUS}"
          echo "Response Body:"
          jq . response.json 2>/dev/null || cat response.json

          if [[ "${HTTP_STATUS}" -ne 201 ]]; then
            echo "::error::API returned failure status: ${HTTP_STATUS}"

            if jq -e '.violations' response.json >/dev/null 2>&1; then
              echo "Validation Violations:"
              jq '.violations' response.json
            fi

            exit 1
          fi

          VERSION_ID=$(jq -r '.id' response.json)
          echo "Successfully created version ID: ${VERSION_ID}"
